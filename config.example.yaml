## CrawlObserver configuration

# Crawler settings
crawler:
  # Number of concurrent fetch workers
  workers: 10
  # Default delay between requests to the same host
  delay: 1s
  # Maximum number of pages to crawl (0 = unlimited)
  max_pages: 0
  # Maximum crawl depth (0 = unlimited)
  max_depth: 0
  # Request timeout
  timeout: 30s
  # User-Agent string
  user_agent: "CrawlObserver/1.0"
  # Maximum response body size
  max_body_size: 10485760  # 10MB
  # Respect robots.txt
  respect_robots: true
  # Headers sent with every crawl request — pages, robots.txt, sitemaps and
  # JavaScript rendering alike. These are the default; a crawl that belongs to
  # a project sends the project's headers instead, set from the project page.
  # Host, Content-Length and User-Agent are refused: the first two are computed
  # from the request, and the third has its own setting above.
  headers: {}
    # Signature-Agent: '"https://example.com/.well-known/http-message-signatures-directory"'
    # Signature-Input: 'sig1=("@authority" "signature-agent");created=1757000000;expires=1757003600;keyid="k1";alg="ed25519";tag="web-bot-auth"'
    # Signature: 'sig1=:BASE64:'"
  # Store raw HTML body in ClickHouse (ZSTD compressed)
  store_html: false
  # Record where each link sits in its page: landmark, XPath, depth,
  # document order and block signature. Turn off to trade the detail for
  # a little parsing time and storage on very large crawls.
  store_link_position: true

# ClickHouse connection
clickhouse:
  host: localhost
  port: 19000
  database: crawlobserver
  username: default
  password: ""

# Storage buffer settings
storage:
  # Flush buffer after this many rows
  batch_size: 1000
  # Flush buffer after this duration
  flush_interval: 5s

# Resource limits
resources:
  # Memory soft limit in MB (0 = auto, based on CPU count)
  max_memory_mb: 0
  # Max CPU cores / GOMAXPROCS (0 = all available)
  max_cpu: 0

# Web server settings
server:
  host: 127.0.0.1
  port: 8899
  # Basic auth credentials (CHANGE THESE before exposing to the internet)
  username: admin
  password: crawlobserver

# Theme / branding
theme:
  # Application name shown in sidebar
  app_name: CrawlObserver
  # Logo URL (leave empty for default icon)
  logo_url: ""
  # Primary accent color (hex)
  accent_color: "#7c3aed"
  # Color mode: "light" or "dark"
  mode: light
