## CrawlObserver configuration

# Crawler settings
crawler:
  # Number of concurrent fetch workers
  workers: 10
  # Default delay between requests to the same host
  delay: 1s
  # Maximum number of pages to crawl (0 = unlimited)
  max_pages: 0
  # Maximum crawl depth (0 = unlimited)
  max_depth: 0
  # Request timeout
  timeout: 30s
  # User-Agent string
  user_agent: "CrawlObserver/1.0"
  # Maximum response body size
  max_body_size: 10485760  # 10MB
  # Respect robots.txt
  respect_robots: true
  # Headers for crawls without a project. A project's own settings replace
  # these completely, including an empty set. Sent only to exact seed origins
  # (scheme, hostname and port), including pages, robots.txt, sitemaps and JS.
  # Redirects, other ports, subdomains and external sitemap URLs never grant
  # access to these headers. Use the intended HTTPS URL in your seeds.
  # Values are reloaded when a crawl starts/resumes/retries, including after
  # queueing. Signatures are supplied externally; they are not auto-refreshed.
  # Host, Content-Length and User-Agent are refused: the first two are computed
  # from the request, and the third has its own setting above.
  headers: {}
    # Signature-Agent: '"https://example.com/.well-known/http-message-signatures-directory"'
    # Signature-Input: 'sig1=("@authority" "signature-agent");created=1757000000;expires=1757003600;keyid="k1";alg="ed25519";tag="web-bot-auth"'
    # Signature: 'sig1=:BASE64:'
  # Store raw HTML body in ClickHouse (ZSTD compressed)
  store_html: false
  # Record link positions: landmark, XPath, depth, document order and block
  # signature. Can also be overridden in the crawl form, API or CLI.
  store_link_position: true
  # Enrich only the first N extracted links per page (positive integer).
  # Every link is still stored, followed and counted for PageRank.
  max_link_positions_per_page: 1000

# ClickHouse connection
clickhouse:
  host: localhost
  port: 19000
  database: crawlobserver
  username: default
  password: ""

# Storage buffer settings
storage:
  # Flush buffer after this many rows
  batch_size: 1000
  # Flush buffer after this duration
  flush_interval: 5s

# Resource limits
resources:
  # Memory soft limit in MB (0 = auto, based on CPU count)
  max_memory_mb: 0
  # Max CPU cores / GOMAXPROCS (0 = all available)
  max_cpu: 0

# Web server settings
server:
  host: 127.0.0.1
  port: 8899
  # Basic auth credentials (CHANGE THESE before exposing to the internet)
  username: admin
  password: crawlobserver

# Theme / branding
theme:
  # Application name shown in sidebar
  app_name: CrawlObserver
  # Logo URL (leave empty for default icon)
  logo_url: ""
  # Primary accent color (hex)
  accent_color: "#7c3aed"
  # Color mode: "light" or "dark"
  mode: light
